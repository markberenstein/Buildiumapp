<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Outstanding Balances</title>
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balances Admin">
<meta name="theme-color" content="#22463C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F1EC; --panel: #FBFAF7; --ink: #1B1F1D; --ink-soft: #5B6158;
    --ledger: #22463C; --ledger-soft: #E4EBE7; --brick: #A63D2F; --brick-soft: #F5E4E0; --hairline: #D9D6CC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Inter", -apple-system, sans-serif;
    padding: 40px 16px 60px;
  }
  .panel { width: 100%; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  input[type="password"], input[type="text"], input[type="file"], input[type="number"], select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--hairline);
    border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; font-size: 14px;
    margin-bottom: 16px;
  }
  button {
    padding: 10px 16px; background: var(--ledger); color: #fff; border: none;
    border-radius: 6px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; color: var(--brick); border: 1px solid var(--brick); }
  button.ghost { background: transparent; color: var(--ledger); border: 1px solid var(--ledger); }
  .error { color: var(--brick); font-size: 13px; margin: -8px 0 16px; }
  .note { font-size: 13px; color: var(--ink-soft); margin: -8px 0 16px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .app-links { display: flex; flex-direction: column; gap: 4px; margin: 0 0 20px; font-size: 13px; }
  .app-links a { color: var(--ledger); }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }

  table.review { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
  table.review th {
    text-align: left; font-weight: 600; color: var(--ink-soft); font-size: 11.5px;
    padding: 6px 6px; border-bottom: 1px solid var(--hairline);
  }
  table.review td { padding: 6px 6px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  table.review tr.flagged { background: var(--brick-soft); }
  table.review input { margin: 0; padding: 6px 8px; font-size: 13px; }
  table.review input.total-input { width: 100px; }
  table.review input.notes-input { width: 160px; }
  table.review select.portfolio-select { padding: 6px 4px; font-size: 12px; }
  .flag-note { font-size: 11px; color: var(--brick); margin-top: 2px; }
  .remove-row { background: none; border: none; color: var(--brick); font-size: 16px; cursor: pointer; padding: 0 6px; }
</style>
</head>
<body>
<div class="panel">
  <div id="login-view">
    <h1>Admin login</h1>
    <div class="error" id="login-error" style="display:none"></div>
    <label for="password">Password</label>
    <input type="password" id="password" />
    <button id="login-btn">Log in</button>
  </div>

  <div id="admin-view" style="display:none">
    <div class="top">
      <h1>Post outstanding balances</h1>
      <button class="secondary" id="logout-btn">Log out</button>
    </div>

    <div class="app-links">
      <a href="/ba-partners" target="_blank">View BA Partners app →</a>
      <a href="/ford-owed" target="_blank">View Ford Owed app →</a>
      <a href="/steve-jeanne" target="_blank">View Steve and Jeanne Owned app →</a>
      <a href="/berenstein-associates" target="_blank">View Berenstein Associates app →</a>
 
    </div>

    <!-- Step 1: upload -->
    <div id="upload-step">
      <div class="error" id="upload-error" style="display:none"></div>
      <label for="file">Full outstanding-balances screenshot</label>
      <input type="file" id="file" accept="image/*" />
      <button id="parse-btn">Read screenshot</button>
    </div>

    <!-- Step 2: review -->
    <div id="review-step" style="display:none">
      <p class="note" id="review-note"></p>
      <div class="error" id="publish-error" style="display:none"></div>
      <table class="review">
        <thead>
     <tr><th>Lease / tenant</th><th>Portfolio</th><th>Balance</th><th>Notes</th><th></th></tr>

        </thead>
        <tbody id="review-body"></tbody>
      </table>
      <div class="row">
        <button class="ghost" id="add-row-btn">+ Add row</button>
        <button id="publish-btn">Publish</button>
        <button class="secondary" id="cancel-btn">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
let PORTFOLIOS = {};
let currentRows = [];
let currentSourceImage = null;

async function loadPortfolios() {
  const res = await fetch("/api/portfolios");
  PORTFOLIOS = await res.json();
}

async function checkStatus() {
  const res = await fetch("/admin/status");
  const data = await res.json();
  if (data.loggedIn) showAdmin(); else showLogin();
}

function showLogin() {
  document.getElementById("login-view").style.display = "block";
  document.getElementById("admin-view").style.display = "none";
}

async function showAdmin() {
  document.getElementById("login-view").style.display = "none";
  document.getElementById("admin-view").style.display = "block";
  await loadPortfolios();
}

document.getElementById("login-btn").addEventListener("click", async () => {
  const password = document.getElementById("password").value;
  const res = await fetch("/admin/login", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ password }),
  });
  const data = await res.json();
  const err = document.getElementById("login-error");
  if (!res.ok) { err.textContent = data.error; err.style.display = "block"; return; }
  err.style.display = "none";
  showAdmin();
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  await fetch("/admin/logout", { method: "POST" });
  showLogin();
});

document.getElementById("parse-btn").addEventListener("click", async () => {
  const fileInput = document.getElementById("file");
  const err = document.getElementById("upload-error");
  const btn = document.getElementById("parse-btn");
  if (!fileInput.files.length) { err.textContent = "Choose a screenshot first."; err.style.display = "block"; return; }

  btn.disabled = true; btn.textContent = "Reading…";
  const fd = new FormData();
  fd.append("file", fileInput.files[0]);

  try {
    const res = await fetch("/admin/parse", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error; err.style.display = "block"; return; }
    err.style.display = "none";
    currentRows = data.rows;
    currentSourceImage = data.sourceImage;
    renderReview();
    document.getElementById("upload-step").style.display = "none";
    document.getElementById("review-step").style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "Read screenshot";
  }
});

function renderReview() {
  const flagged = currentRows.filter(r => r.needsReview).length;
  document.getElementById("review-note").textContent =
    `${currentRows.length} rows read` +
    (flagged ? ` — ${flagged} need a manual check (highlighted below).` : " — all balances read cleanly.") +
    " Check each row before publishing.";

  const body = document.getElementById("review-body");
  body.innerHTML = currentRows.map(r => `
    <tr class="${r.needsReview ? 'flagged' : ''}" data-id="${r.id}">
      <td>
        <input type="text" class="label-input" value="${(r.label || '').replace(/"/g, '&quot;')}" />
        ${r.needsReview ? '<div class="flag-note">Could not read a clean balance — check the screenshot</div>' : ''}
      </td>
      <td>
        <select class="portfolio-select">
          ${Object.entries(PORTFOLIOS).map(([key, p]) =>
            `<option value="${key}" ${r.portfolio === key ? 'selected' : ''}>${p.label}</option>`
          ).join("")}
        </select>
      </td>
      <td><input type="number" step="0.01" class="total-input" value="${r.total ?? ''}" /></td>
      <td><input type="text" class="notes-input" placeholder="optional" value="${(r.notes || '').replace(/"/g, '&quot;')}" /></td>

      <td><button class="remove-row" data-id="${r.id}">✕</button></td>
    </tr>
  `).join("");

  body.querySelectorAll(".remove-row").forEach(btn => {
    btn.addEventListener("click", () => {
      currentRows = currentRows.filter(r => r.id !== btn.dataset.id);
      renderReview();
    });
  });
}

document.getElementById("add-row-btn").addEventListener("click", () => {
  currentRows.push({
    id: "new-" + Math.random().toString(36).slice(2),
    label: "", leaseId: null, total: null,
    portfolio: Object.keys(PORTFOLIOS)[0], needsReview: false,
  });
  renderReview();
});

document.getElementById("cancel-btn").addEventListener("click", () => {
  currentRows = []; currentSourceImage = null;
  document.getElementById("file").value = "";
  document.getElementById("review-step").style.display = "none";
  document.getElementById("upload-step").style.display = "block";
});

document.getElementById("publish-btn").addEventListener("click", async () => {
  const err = document.getElementById("publish-error");
  const btn = document.getElementById("publish-btn");

  // Pull current edited values out of the DOM into currentRows
  const trs = document.querySelectorAll("#review-body tr");
  const edited = [];
  trs.forEach(tr => {
    const id = tr.dataset.id;
    const label = tr.querySelector(".label-input").value;
    const portfolio = tr.querySelector(".portfolio-select").value;
    const total = tr.querySelector(".total-input").value;
    edited.push({ id, label, portfolio, total });
  });

  btn.disabled = true; btn.textContent = "Publishing…";
  try {
    const res = await fetch("/admin/publish", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ rows: edited, sourceImage: currentSourceImage }),
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error; err.style.display = "block"; return; }
    err.style.display = "none";
    currentRows = []; currentSourceImage = null;
    document.getElementById("file").value = "";
    document.getElementById("review-step").style.display = "none";
    document.getElementById("upload-step").style.display = "block";
    alert("Published. All four apps are now showing this data.");
  } finally {
    btn.disabled = false; btn.textContent = "Publish";
  }
});

checkStatus();
</script>
</body>
</html>
