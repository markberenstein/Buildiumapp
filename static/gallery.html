<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outstanding Balances</title>
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balances">
<meta name="theme-color" content="#22463C"> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F1EC;
    --panel: #FBFAF7;
    --ink: #1B1F1D;
    --ink-soft: #5B6158;
    --ledger: #22463C;
    --ledger-soft: #E4EBE7;
    --hairline: #D9D6CC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, sans-serif;
    padding: 32px 24px 60px;
  }
  .head {
    max-width: 900px;
    margin: 0 auto 28px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 16px;
  }
  .head h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .head .note { font-size: 13px; color: var(--ink-soft); }
  .cards {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    overflow: hidden;
  }
  .card img { display: block; width: 100%; height: auto; }
  .card .meta {
    padding: 12px 16px;
    font-size: 13px;
    color: var(--ink-soft);
    border-top: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card .caption { color: var(--ink); font-weight: 500; }
  .empty { max-width: 900px; margin: 60px auto; text-align: center; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="head">
    <h1>Outstanding Balances</h1>
    <span class="note" id="note">Manually posted — testing mode</span>
  </div>
  <div class="cards" id="cards"><div class="empty">Loading…</div></div>

<script>
async function load() {
  const res = await fetch("/api/screenshots");
  const data = await res.json();
  const wrap = document.getElementById("cards");
  if (!data.entries.length) {
    wrap.innerHTML = '<div class="empty">Nothing posted yet.</div>';
    return;
  }
  wrap.innerHTML = data.entries.map(e => `
    <div class="card">
      <img src="/uploads/${e.filename}" alt="${e.caption || 'Balance screenshot'}" />
      <div class="meta">
        <span class="caption">${e.caption || ""}</span>
        <span>${new Date(e.uploadedAt * 1000).toLocaleString()}</span>
      </div>
    </div>
  `).join("");
}
load();
</script>
</body>
</html>
